<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="녹음전사">
  <title>녹음 &amp; 전사</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🎙️ 녹음 &amp; 전사</h1>
      <p class="subtitle">브라우저에서 바로 녹음하고 실시간으로 텍스트로 변환합니다</p>
    </header>

    <section class="controls card">
      <div class="control-row">
        <label for="language">전사 언어</label>
        <select id="language">
          <option value="ko-KR" selected>한국어</option>
          <option value="en-US">English (US)</option>
          <option value="ja-JP">日本語</option>
          <option value="zh-CN">中文 (简体)</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
        </select>
      </div>

      <div class="visualizer-wrap">
        <canvas id="visualizer" width="600" height="80"></canvas>
        <span id="timer" class="timer">00:00</span>
      </div>

      <div class="buttons">
        <button id="recordBtn" class="btn btn-record">
          <span class="dot"></span>녹음 시작
        </button>
        <button id="pauseBtn" class="btn" disabled>일시정지</button>
        <button id="stopBtn" class="btn btn-stop" disabled>정지</button>
      </div>

      <p id="status" class="status">마이크 권한을 허용하면 녹음이 시작됩니다.</p>
      <p id="speechWarning" class="warning hidden">
        ⚠️ 이 브라우저는 음성 인식(Web Speech API)을 지원하지 않아 전사 없이 녹음만 가능합니다.
        Chrome 또는 Edge 사용을 권장합니다.
      </p>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>실시간 전사</h2>
        <div class="section-actions">
          <button id="copyBtn" class="btn btn-small" disabled>복사</button>
          <button id="downloadTextBtn" class="btn btn-small" disabled>텍스트 저장</button>
          <button id="clearBtn" class="btn btn-small" disabled>지우기</button>
        </div>
      </div>
      <div id="transcript" class="transcript" aria-live="polite">
        <span class="placeholder">녹음을 시작하면 전사 내용이 여기에 표시됩니다.</span>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>녹음 기록</h2>
        <button id="clearHistoryBtn" class="btn btn-small" disabled>기록 전체 삭제</button>
      </div>
      <ul id="recordings" class="recordings">
        <li class="placeholder">아직 녹음이 없습니다.</li>
      </ul>
    </section>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
